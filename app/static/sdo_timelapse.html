<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SDO Timelapse</title>
<style>
body {
  background:#0b0f14;
  color:#00ffcc;
  font-family:monospace;
  text-align:center;
}
.container {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
.card {
  background:black;
  margin:10px;
  padding:10px;
  border-radius:8px;
}
img {
  width:320px;
  display:block;
  margin:5px auto;
}
</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body>
<h2>🌞 SDO Timelapse (Generated Locally)</h2>

<div class="container">
  <div class="card">
    <h3>171 Å</h3>
    <img id="t171">
  </div>
  <div class="card">
    <h3>304 Å</h3>
    <img id="t304">
  </div>
  <div class="card">
    <h3>131 Å</h3>
    <img id="t131">
  </div>
</div>

<script>
function refresh(){
  let t = Date.now();

  let t171 = document.getElementById("t171");
  let t304 = document.getElementById("t304");
  let t131 = document.getElementById("t131");

  if(!t171 || !t304 || !t131){
    console.log("DOM not ready");
    return;
  }

  t171.src = `/timelapse/0171.gif?${t}`;
  t304.src = `/timelapse/0304.gif?${t}`;
  t131.src = `/timelapse/0131.gif?${t}`;
}

// ✅ CRITICAL FIX
window.addEventListener("DOMContentLoaded", () => {
  refresh();
  setInterval(refresh, 30000);
});
</script>

</body>
</html>
